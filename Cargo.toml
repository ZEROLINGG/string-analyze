[package]
name = "string-analyze"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Find key strings from cluttered text"
readme = "README.md"
repository = "https://github.com/ZEROLINGG/string-analyze"
documentation = "https://docs.rs/string-analyze"
homepage = "https://github.com/ZEROLINGG/string-analyze"
keywords = ["ctf", "security", "secret-scanning", "entropy", "string-analysis"]
categories = ["command-line-utilities", "text-processing"]
authors = ["ZEROLINGG"]
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
regex = "1"
rayon = "1.12.0"
inventory = "0.3"
base64 = "0.23"
hex = "0.4"


[dev-dependencies]
rand = "0.10.2"